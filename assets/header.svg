<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">George Paraskevopoulos</title>
  <desc id="desc">Native tools. Thoughtful interfaces. macOS utilities and music experiences. A midnight blue banner with mint accents and an orbital code emblem.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d1726"/>
      <stop offset="1" stop-color="#142938"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#65d9c2" stop-opacity=".13"/>
      <stop offset="1" stop-color="#65d9c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#88f0d1"/>
      <stop offset="1" stop-color="#7a9ef5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9abbdb" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="rounded"><rect width="1200" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="975" cy="160" r="300" fill="url(#glow)"/>
    <path d="M0 359H1200" stroke="#88f0d1" stroke-opacity=".3" stroke-width="2"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <path d="M58 53h7v7h-7z" fill="#88f0d1"/>
      <text x="78" y="62" fill="#9eafc5" font-size="15" font-weight="600" letter-spacing="2.1">GEORGE PARASKEVOPOULOS</text>
      <text x="56" y="147" fill="#f1f5fa" font-size="59" font-weight="700" letter-spacing="-2">Native tools.</text>
      <text x="56" y="214" fill="#88f0d1" font-size="59" font-weight="700" letter-spacing="-2">Thoughtful interfaces.</text>
      <text x="59" y="263" fill="#afbed0" font-size="21">macOS utilities + music experiences</text>
      <text x="59" y="318" fill="#8296ae" font-size="15" letter-spacing=".8">@Unknown-George</text>
    </g>

    <g transform="translate(975 180)">
      <circle r="138" fill="none" stroke="#a2c3e5" stroke-opacity=".1"/>
      <circle r="109" fill="none" stroke="#a2c3e5" stroke-opacity=".15" stroke-dasharray="2 9"/>
      <ellipse rx="151" ry="56" transform="rotate(-38)" fill="none" stroke="url(#orbit)" stroke-opacity=".55" stroke-width="1.5"/>
      <circle r="75" fill="#122433" stroke="url(#orbit)" stroke-opacity=".5"/>
      <path d="m-25-18-20 18 20 18m50-36 20 18-20 18m-12-47-25 58" fill="none" stroke="url(#orbit)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="111" cy="-77" r="6" fill="#88f0d1"/>
      <circle cx="-112" cy="76" r="4" fill="#96b0ff"/>
      <path d="M-34-148h12m-6-6v12M113 116h12m-6-6v12" fill="none" stroke="#7e98b4" stroke-width="1.5"/>
    </g>
  </g>
</svg>
